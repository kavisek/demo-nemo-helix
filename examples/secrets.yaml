# Secrets each NeMo Studio workspace should have, applied by the sync-secrets DAG.
# No values live here: each secret names the Airflow Variable that holds its value.
# Set one with `make airflow-secret VAR=helix_secret_nvidia_api_key` (prompts for the value).
# Secrets whose Variable is unset are skipped. Secrets not listed here are only
# removed when the DAG runs with prune=true.
workspaces:
  default:
    - name: nvidia-api-key
      description: NVIDIA Build API key for the nvidia-build provider (examples/anonymizer-run.yaml)
      variable: helix_secret_nvidia_api_key
    - name: hf-token
      description: Hugging Face token for gated models (Safe Synthesizer hf_token_secret)
      variable: helix_secret_hf_token
    - name: demo-webhook-token
      description: Example secret for trying sync-secrets
      variable: helix_secret_demo_webhook_token
