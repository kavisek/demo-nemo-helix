# Grafana + PostgreSQL + Flyway + pgAdmin in one file, parameterized so the
# same stack runs dev, staging, and prod side by side.
#
# One project per environment (separate containers, network, and volumes):
#   docker compose -p grafana-<env> --env-file envs/<env>.env -f docker-compose.yml [-f docker-compose.dev.yml] up -d
#
# Everything that differs per environment comes from envs/<env>.env. Shell env
# vars win over the env file, which is how `make` injects the image names.

services:
  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE (make start sets it)}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-7003}:3000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in envs/<env>.env}
      # Only applied when Grafana creates its database (first start). Changing
      # them later needs `grafana cli admin reset-admin-password` or a fresh volume.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in envs/<env>.env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in envs/<env>.env}
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # No outbound calls: telemetry, update checks, plugin catalog, news, gravatar.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Read by provisioning/datasources/datasource.yaml.
      DS_POSTGRES_HOST: postgres
      DS_POSTGRES_DB: postgres
      DS_POSTGRES_USER: postgres
      DS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in envs/<env>.env}
      # Airflow's metadata DB, reached on the published port of the matching airflow-<env> stack.
      DS_AIRFLOW_HOST: ${AIRFLOW_DB_HOST:-host.docker.internal}
      DS_AIRFLOW_PORT: ${AIRFLOW_DB_PORT:-7432}
      DS_AIRFLOW_DB: ${AIRFLOW_DB_NAME:-airflow}
      DS_AIRFLOW_USER: ${AIRFLOW_DB_USER:-airflow}
      DS_AIRFLOW_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in envs/<env>.env}
    volumes:
      # Grafana's own SQLite DB: users, stars, preferences. Dashboards and the
      # data source are provisioned from files on every start.
      - grafana-data:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

  postgres:
    image: postgres:16
    # pg_stat_statements powers the PostgreSQL Monitoring dashboard's top queries.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=400
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-7440}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - network

  # Runs `flyway migrate` once and exits 0. V* files apply once, in version
  # order; R__* (repeatable) files re-apply whenever their checksum changes.
  flyway:
    image: ${FLYWAY_IMAGE:?set FLYWAY_IMAGE (make start sets it)}
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 60
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in envs/<env>.env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-7004}:80"
    volumes:
      # Pre-registers the postgres server (password is asked on first connect).
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

volumes:
  grafana-data:
  db:
  pgadmin-data:

networks:
  network:
    driver: bridge
